name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  clojure:
    name: Clojure suite (Datomic Free peer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: DeLaGuardo/setup-clojure@12.5
        with:
          cli: 1.11.1.1347

      - name: Cache Maven deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: clj-${{ runner.os }}-${{ hashFiles('deps.edn') }}

      - name: Namespace load check
        run: |
          clojure --version
          ./scripts/check-namespaces.sh

      - name: Test suite
        run: clojure -M:test

  frontend-typecheck:
    name: Frontend typecheck (ontology-traceability)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/ontology-traceability
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/ontology-traceability/package-lock.json

      - run: npm ci

      - run: npm run test
